<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio item decisions</title>
  <style>
    :root {
      --cream: #f5f1e8;
      --paper: #fffdf8;
      --brown: #4e4038;
      --muted: #73665d;
      --teal: #447c78;
      --teal-dark: #285e5a;
      --sage: #a9b79f;
      --ochre: #d2a34f;
      --terracotta: #bd7158;
      --correct: #2f6b50;
      --incorrect: #a24436;
      --border: #d9cfc1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: clamp(12px, 3vw, 28px);
      background: var(--cream);
      color: var(--brown);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    .activity {
      width: min(1080px, 100%);
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(78, 64, 56, .10);
    }

    header {
      padding: 22px clamp(18px, 4vw, 34px) 18px;
      border-top: 9px solid var(--teal);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(110deg, #fffaf0, #edf2e9);
    }

    h1 { margin: 0 0 5px; font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.2; }
    header p { margin: 0; color: var(--muted); }

    main { padding: clamp(16px, 4vw, 32px); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
    th { padding: 0 12px 4px; text-align: left; font-size: .92rem; color: var(--muted); }
    th:last-child { width: 42%; }
    td { padding: 14px 12px; background: #faf7f0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    td:first-child { border-left: 5px solid var(--sage); border-radius: 9px 0 0 9px; font-weight: 600; }
    td:last-child { border-right: 1px solid var(--border); border-radius: 0 9px 9px 0; }

    tr.correct td { background: #edf6ef; border-color: #9abca8; }
    tr.correct td:first-child { border-left-color: var(--correct); }
    tr.incorrect td { background: #fff0eb; border-color: #db9b8b; }
    tr.incorrect td:first-child { border-left-color: var(--incorrect); }

    select {
      width: 100%; min-height: 44px; padding: 8px 36px 8px 10px;
      border: 2px solid #aa9e90; border-radius: 7px;
      background: #fff; color: var(--brown); font: inherit;
    }
    select:focus { outline: 3px solid rgba(210, 163, 79, .45); outline-offset: 2px; border-color: var(--teal-dark); }
    .correct select { border-color: var(--correct); }
    .incorrect select { border-color: var(--incorrect); }

    .item-feedback { display: block; min-height: 1.25em; margin-top: 5px; font-size: .86rem; font-weight: 700; }
    .correct .item-feedback { color: var(--correct); }
    .incorrect .item-feedback { color: var(--incorrect); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
    button { min-height: 44px; padding: 10px 18px; border: 2px solid var(--teal-dark); border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
    #check { background: var(--teal); color: #fff; }
    #check:hover { background: var(--teal-dark); }
    #reset { background: transparent; color: var(--teal-dark); }
    button:focus { outline: 3px solid rgba(210, 163, 79, .55); outline-offset: 2px; }

    #summary { flex: 1 1 250px; min-height: 44px; margin: 0; padding: 10px 14px; border-left: 5px solid var(--ochre); background: #fff6df; border-radius: 5px; font-weight: 700; }
    #summary.success { border-left-color: var(--correct); background: #e7f3ea; color: var(--correct); }

    @media (max-width: 680px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      tr { margin-bottom: 14px; border: 1px solid var(--border); border-left: 5px solid var(--sage); border-radius: 9px; overflow: hidden; }
      td, td:first-child, td:last-child { border: 0; border-radius: 0; }
      td:first-child { padding-bottom: 7px; border: 0; }
      td:last-child { padding-top: 7px; }
      tr.correct, tr.incorrect { border-left-width: 5px; }
    }

    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <section class="activity" aria-labelledby="activity-title">
    <header>
      <h1 id="activity-title">Portfolio item decisions</h1>
      <p>Select the appropriate decision for each portfolio item, then check your answers.</p>
    </header>
    <main>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">Portfolio item</th><th scope="col">Decision</th></tr></thead>
          <tbody id="items"></tbody>
        </table>
      </div>
      <div class="controls">
        <button id="check" type="button">Check answers</button>
        <button id="reset" type="button">Reset</button>
        <p id="summary" role="status" aria-live="polite">Choose a decision for each item.</p>
      </div>
    </main>
  </section>

  <script>
    const decisions = [
      'Keep',
      'Exclude',
      'Keep, subject to agency requirements',
      'Adapt or exclude',
      'Adapt',
      'Keep, if permitted',
      'Seek permission or adapt',
      'Exclude unless retention and use are authorised'
    ];

    const items = [
      ['A certificate from an approved professional development workshop', 'Keep'],
      ['A case note containing a service user’s initials and history', 'Exclude'],
      ['A generic assessment framework created by the student and approved for use', 'Keep, subject to agency requirements'],
      ['A reflective entry describing a rare case in a small community', 'Adapt or exclude'],
      ['A summary of learning from supervision with identifying details removed', 'Adapt'],
      ['A screenshot from the agency’s client management system', 'Exclude'],
      ['A university assignment containing a fictional case study', 'Keep, if permitted'],
      ['Positive feedback copied from a private email without the sender’s permission', 'Seek permission or adapt'],
      ['A de-identified project summary approved by the agency', 'Keep'],
      ['An internal agency policy', 'Exclude unless retention and use are authorised']
    ];

    const tbody = document.getElementById('items');
    const summary = document.getElementById('summary');

    items.forEach(([item, answer], index) => {
      const row = document.createElement('tr');
      const options = decisions.map(decision => `<option value="${decision}">${decision}</option>`).join('');
      row.dataset.answer = answer;
      row.innerHTML = `
        <td id="item-${index}">${item}</td>
        <td>
          <select aria-labelledby="item-${index}" aria-describedby="feedback-${index}">
            <option value="">Select a decision</option>${options}
          </select>
          <span class="item-feedback" id="feedback-${index}"></span>
        </td>`;
      tbody.appendChild(row);
    });

    document.getElementById('check').addEventListener('click', () => {
      let correct = 0;
      let unanswered = 0;

      [...tbody.rows].forEach(row => {
        const select = row.querySelector('select');
        const feedback = row.querySelector('.item-feedback');
        const isCorrect = select.value === row.dataset.answer;
        row.classList.remove('correct', 'incorrect');

        if (!select.value) {
          unanswered++;
          row.classList.add('incorrect');
          feedback.textContent = 'Select an answer.';
        } else if (isCorrect) {
          correct++;
          row.classList.add('correct');
          feedback.textContent = 'Correct';
        } else {
          row.classList.add('incorrect');
          feedback.textContent = 'Try again.';
        }
      });

      summary.classList.toggle('success', correct === items.length);
      if (correct === items.length) {
        summary.textContent = 'Excellent. All 10 decisions are correct.';
      } else if (unanswered > 0) {
        summary.textContent = `${correct} of 10 correct. Complete the unanswered items and try again.`;
      } else {
        summary.textContent = `${correct} of 10 correct. Review the highlighted items and try again.`;
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      [...tbody.rows].forEach(row => {
        row.classList.remove('correct', 'incorrect');
        row.querySelector('select').value = '';
        row.querySelector('.item-feedback').textContent = '';
      });
      summary.classList.remove('success');
      summary.textContent = 'Choose a decision for each item.';
      tbody.querySelector('select').focus();
    });

    tbody.addEventListener('change', event => {
      const row = event.target.closest('tr');
      row.classList.remove('correct', 'incorrect');
      row.querySelector('.item-feedback').textContent = '';
    });
  </script>
</body>
</html>
